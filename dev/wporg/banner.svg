<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d01"/>
      <stop offset="1" stop-color="#b845ed"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.18" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#ff5d01" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5d01" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#b845ed" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#b845ed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1544" height="500" fill="#17191e"/>
  <rect width="1544" height="500" fill="url(#grid)"/>
  <rect width="1544" height="500" fill="url(#glow-a)"/>
  <rect width="1544" height="500" fill="url(#glow-b)"/>

  <!-- The logo mark from assets/logo.svg, scaled. -->
  <g transform="translate(120 105) scale(4.6)">
    <rect width="64" height="64" rx="14" fill="#22252c" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M32 9 15 54h7.4l3.6-9.4h12l3.6 9.4H49L32 9Zm0 14.6 4 11.4h-8l4-11.4Z" fill="url(#mark)"/>
    <circle cx="49" cy="15" r="4" fill="#fff"/>
  </g>

  <g font-family="'Inter Display', Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="480" y="228" font-size="124" font-weight="800" fill="#ffffff" letter-spacing="-3">WP2Astro</text>
    <text x="484" y="300" font-size="42" font-weight="500" fill="#c9cdd6">WordPress in, fast Astro site out.</text>
    <g font-size="27" font-weight="600" fill="#ffffff">
      <rect x="484" y="342" width="196" height="54" rx="27" fill="#ffffff" fill-opacity="0.08" stroke="#ff5d01" stroke-opacity="0.7"/>
      <text x="582" y="378" text-anchor="middle">Same URLs</text>
      <rect x="696" y="342" width="196" height="54" rx="27" fill="#ffffff" fill-opacity="0.08" stroke="#e0508a" stroke-opacity="0.7"/>
      <text x="794" y="378" text-anchor="middle">Same look</text>
      <rect x="908" y="342" width="268" height="54" rx="27" fill="#ffffff" fill-opacity="0.08" stroke="#b845ed" stroke-opacity="0.7"/>
      <text x="1042" y="378" text-anchor="middle">Synced to GitHub</text>
    </g>
  </g>
</svg>
